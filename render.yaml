services:
  - type: web
    name: pulsepoll-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DB_NAME
        value: pulsepoll_db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
